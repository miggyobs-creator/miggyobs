
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Gallery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --cyan: #20b8ed;
  --blue: #1675b5;
  --navy: #164b79;
  --pale: #e8f8ff;
  --ink: #154d7d;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Poppins', Arial, sans-serif;
  color: var(--ink);
  background: white;
  background-image: radial-gradient(#8bdfff 1px, transparent 1px);
  background-size: 15px 15px;
}

/* NAVIGATION BAR */

.navbar {
  position: fixed;
  z-index: 50;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: min(1120px, calc(100% - 28px));
  min-height: 64px;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  background: rgba(255,255,255,.95);
  border: 3px solid var(--cyan);
  border-radius: 24px;
  box-shadow: 0 5px 0 var(--navy),
              0 10px 22px #1675b522;
  backdrop-filter: blur(12px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--ink);
  text-decoration: none;
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  white-space: nowrap;
}

.brand-mark {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--pale);
  border: 2px solid var(--cyan);
  font-size: 18px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: clamp(10px, 2vw, 26px);
}

.nav-links a {
  font-size: .82rem;
  font-weight: 700;
  text-decoration: none;
  color: var(--ink);
  transition: color .2s, transform .2s;
}

.nav-links a:hover,
.nav-links a[aria-current="page"] {
  color: var(--blue);
  transform: translateY(-2px);
}

.menu-toggle {
  display: none;
  border: 2px solid var(--cyan);
  background: var(--pale);
  color: var(--ink);
  border-radius: 12px;
  padding: 8px 11px;
  cursor: pointer;
  font-size: 1.1rem;
}

/* PAGE LAYOUT */

main {
  width: min(1120px, calc(100% - 32px));
  margin: 0 auto;
  padding: 132px 0 64px;
}

.hero {
  position: relative;
  padding: 30px clamp(20px, 5vw, 54px) 34px;
  margin-bottom: 28px;
  background: white;
  border: 3px solid var(--cyan);
  border-radius: 30px;
  box-shadow: 0 7px 0 var(--navy),
              0 14px 26px #1675b51a;
  overflow: hidden;
  animation: rise .7s ease both;
}

.hero::before {
  content: "✦";
  position: absolute;
  right: 20px;
  top: 5px;
  color: var(--cyan);
  font-size: 44px;
}

.eyebrow {
  font-size: .76rem;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--blue);
}

h1, h2, h3 {
  font-family: 'Orbitron', sans-serif;
}

h1 {
  font-size: clamp(2rem, 5vw, 3.6rem);
  line-height: 1.12;
  margin: 10px 0;
}

.hero p {
  max-width: 650px;
  margin: 12px 0 0;
  line-height: 1.8;
  color: #32668e;
}

/* BLUE PILL BUTTON */

.pill-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 24px;
  padding: 12px 25px;
  min-height: 46px;
  border: 2px solid var(--navy);
  border-radius: 999px;
  background: var(--blue);
  color: white;
  text-decoration: none;
  font-weight: 800;
  font-size: .86rem;
  box-shadow: 0 4px 0 var(--navy),
              0 8px 15px #1675b52b;
  transition: transform .2s, box-shadow .2s;
  cursor: pointer;
}

.pill-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 7px 0 var(--navy),
              0 12px 20px #1675b52b;
}

.pill-button:active {
  transform: translateY(2px);
}

/* GALLERY HEADING */

.section-top {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 18px;
  margin: 30px 4px 18px;
}

.section-top h2 {
  font-size: clamp(1.2rem, 3vw, 1.7rem);
  margin: 0;
}

.section-top p {
  margin: 5px 0 0;
  font-size: .9rem;
  color: #48789b;
}

/* GALLERY GRID */

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

.gallery-card {
  min-width: 0;
  padding: 10px;
  background: white;
  border: 3px solid var(--cyan);
  border-radius: 25px;
  box-shadow: 0 5px 0 var(--navy),
              0 10px 18px #1675b51c;
  cursor: pointer;
  overflow: hidden;
  text-align: left;
  font: inherit;
  color: inherit;
  transition: transform .25s, box-shadow .25s;
  animation: rise .65s ease both;
}

.gallery-card:hover,
.gallery-card:focus-visible {
  transform: translateY(-7px);
  box-shadow: 0 8px 0 var(--navy),
              0 17px 25px #1675b52b;
  outline: none;
}

.photo-wrap {
  position: relative;
  aspect-ratio: 4 / 3;
  border: 2px solid var(--navy);
  border-radius: 16px;
  overflow: hidden;
  background: linear-gradient(135deg, #d9f5ff, #f5fcff);
  display: grid;
  place-items: center;
}

.photo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .45s;
}

.gallery-card:hover .photo-wrap img {
  transform: scale(1.06);
}

.photo-placeholder {
  padding: 20px;
  text-align: center;
  color: #2c76a8;
  font-weight: 700;
}

.photo-placeholder span {
  display: block;
  font-size: 2.2rem;
  margin-bottom: 8px;
}

.view-overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: #0d4777a8;
  color: white;
  font-weight: 800;
  opacity: 0;
  transition: opacity .25s;
}

.gallery-card:hover .view-overlay,
.gallery-card:focus-visible .view-overlay {
  opacity: 1;
}

.card-info {
  display: block;
  padding: 13px 8px 7px;
}

.card-info h3 {
  font-size: .98rem;
  margin: 0 0 5px;
}

.card-info p {
  font-size: .82rem;
  line-height: 1.6;
  color: #4d7797;
  margin: 0;
}

/* FOOTER */

footer {
  text-align: center;
  padding: 24px 12px 8px;
  color: #4b7c9d;
  font-size: .8rem;
}

/* LIGHTBOX */

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 22px;
  background: rgba(5,32,57,.88);
  backdrop-filter: blur(8px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s, visibility .25s;
}

.lightbox.open {
  opacity: 1;
  visibility: visible;
}

.lightbox-panel {
  width: min(1000px, 100%);
  max-height: 92vh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  transform: scale(.94) translateY(12px);
  transition: transform .25s;
}

.lightbox.open .lightbox-panel {
  transform: scale(1) translateY(0);
}

.lightbox-image {
  max-width: 100%;
  max-height: 76vh;
  object-fit: contain;
  border: 3px solid var(--cyan);
  border-radius: 18px;
  background: white;
  box-shadow: 0 6px 0 var(--navy);
}

.lightbox-caption {
  color: white;
  text-align: center;
}

.lightbox-caption h2 {
  font-size: 1.05rem;
  margin: 0 0 4px;
}

.lightbox-caption p {
  font-size: .86rem;
  margin: 0;
  color: #d8f3ff;
}

.lightbox-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.lightbox-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid var(--cyan);
  background: white;
  color: var(--ink);
  font-size: 1.3rem;
  font-weight: 800;
  cursor: pointer;
  transition: transform .2s, background .2s;
}

.lightbox-btn:hover {
  transform: scale(1.08);
  background: var(--pale);
}

.lightbox-count {
  color: white;
  font-weight: 700;
  font-size: .85rem;
  min-width: 58px;
  text-align: center;
}

.lightbox-close {
  position: fixed;
  right: 20px;
  top: 20px;
  width: 46px;
  height: 46px;
  border: 2px solid var(--cyan);
  border-radius: 50%;
  background: white;
  color: var(--ink);
  font-size: 1.5rem;
  cursor: pointer;
}

/* ANIMATIONS */

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* TABLET */

@media (max-width: 800px) {
  .gallery-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .nav-links {
    gap: 12px;
  }

  .nav-links a {
    font-size: .75rem;
  }
}

/* MOBILE */

@media (max-width: 560px) {
  .navbar {
    min-height: 58px;
    padding: 8px 12px;
  }

  .brand {
    font-size: .82rem;
  }

  .menu-toggle {
    display: block;
  }

  .nav-links {
    display: none;
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    right: 0;
    padding: 14px;
    background: white;
    border: 2px solid var(--cyan);
    border-radius: 18px;
    box-shadow: 0 5px 0 var(--navy);
    flex-direction: column;
    align-items: stretch;
  }

  .nav-links.show {
    display: flex;
  }

  .nav-links a {
    padding: 9px 10px;
    font-size: .85rem;
  }

  main {
    padding-top: 108px;
  }

  .hero {
    padding: 25px 21px 28px;
  }

  .gallery-grid {
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .photo-wrap {
    aspect-ratio: 5 / 3;
  }

  .section-top {
    align-items: start;
    flex-direction: column;
  }

  .lightbox {
    padding: 14px;
  }

  .lightbox-image {
    max-height: 67vh;
  }

  .lightbox-close {
    right: 12px;
    top: 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<!-- TOP NAVIGATION -->
<header class="navbar">
  <a class="brand" href="index.html">
    <span>
        <img src="Images/Logo.png" alt="Logo">
    </span>
</a>
<style>
/* Make the logo bigger without resizing the navbar */
  .navbar .brand img {
      width: 100px;
      height: auto;
      max-width: none;
      display: block;
      object-fit: contain;
  }
  
  /* Keep the navbar height consistent */
  .navbar {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
  }
  </style>
  <button class="menu-toggle"
          id="menuToggle"
          aria-label="Toggle navigation"
          aria-expanded="false">☰</button>

  <nav class="nav-links" id="navLinks" aria-label="Main navigation">
    <a href="aboutus.html">About</a>
    <a href="gallery.html" aria-current="page">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>


  </section>

  <!-- 12-IMAGE GALLERY -->
  <section id="photos" aria-labelledby="photosHeading">
    <div class="section-top">
      <div>
        <h2 id="photosHeading">MY FAVORITE SHOTS</h2>
        <p>Click any photo to open the lightbox.</p>
      </div>

      <span class="eyebrow" id="photoTotal">12 PHOTOS</span>
    </div>

    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <footer>Made with curiosity &amp; a little sparkle ✦</footer>

</main>

<!-- LIGHTBOX -->
<div class="lightbox"
     id="lightbox"
     role="dialog"
     aria-modal="true"
     aria-label="Photo viewer"
     aria-hidden="true">

  <button class="lightbox-close"
          id="lightboxClose"
          aria-label="Close lightbox">×</button>

  <div class="lightbox-panel">

    <img class="lightbox-image"
         id="lightboxImage"
         src=""
         alt="">

    <div class="lightbox-caption">
      <h2 id="lightboxTitle"></h2>
      <p id="lightboxDescription"></p>
    </div>

    <div class="lightbox-controls">
      <button class="lightbox-btn"
              id="previousPhoto"
              aria-label="Previous photo">‹</button>

      <span class="lightbox-count" id="lightboxCount">1 / 12</span>

      <button class="lightbox-btn"
              id="nextPhoto"
              aria-label="Next photo">›</button>
    </div>

  </div>
</div>

<script>
// GALLERY CONTENT
// Change titles, descriptions, and image paths here.

const photos = [
  {
    src: "Images/Photo1.jfif",
    title: "Photo with Dad",
    description: "A moment worth keeping.",
    icon: "✦"
  },
  {
    src: "Images/Photo2.jfif",
    title: "Highschool Friends!",
    description: "Somewhere in Bacolod",
    icon: "⌖"
  },
  {
    src: "Images/Photo3.jfif",
    title: "18th Birthday Karaoke!",
    description: "Singing with passion.",
    icon: "❋"
  },
  {
    src: "Images/Photo4.jfif",
    title: "Night Out!",
    description: "NGC December Avenue Concert!.",
    icon: "☼"
  },
  {
    src: "Images/Photo5.jfif",
    title: "Work Immersion Supervisors!",
    description: "A snapshot of the amazing people.",
    icon: "✧"
  },
  {
    src: "Images/Photo6.jfif",
    title: "Dinner with relative",
    description: "Yummy food :P",
    icon: "♡"
  },
  {
    src: "Images/Photo7.jfif",
    title: "Golden Moments",
    description: "A little moment caught in time.",
    icon: "☀"
  },
  {
    src: "Images/Photo8.jfif",
    title: "Fisheye?!",
    description: "Looking through the lens of friends.",
    icon: "⌖"
  },
  {
    src: "Images/Photo9.jfif",
    title: "Music Ministry/Team!",
    description: "Serving The Lord with pleasure.",
    icon: "❋"
  },
  {
    src: "Images/Photo10.jfif",
    title: "Color Stories",
    description: "Arts and Crafts is fun.",
    icon: "✧"
  },
  {
    src: "Images/Photo11.jfif",
    title: "Gala with the friends",
    description: "j.co sure tastes delicious.",
    icon: "➜"
  },
  {
    src: "Images/Photo12.jfif",
    title: "Artoworks!",
    description: "Artwork by Ariana Grenade.",
    icon: "♡"
  }
];

// CREATE ALL 12 GALLERY CARDS
const galleryGrid = document.getElementById("galleryGrid");

photos.forEach((photo, index) => {
  const card = document.createElement("button");
  card.type = "button";
  card.className = "gallery-card";
  card.style.animationDelay = `${index * 0.04}s`;

  card.setAttribute("aria-label", `View ${photo.title}`);

  const photoWrap = document.createElement("span");
  photoWrap.className = "photo-wrap";

  const img = document.createElement("img");
  img.src = photo.src;
  img.alt = photo.title;
  img.loading = "lazy";

  const placeholder = document.createElement("span");
  placeholder.className = "photo-placeholder";
  placeholder.style.display = "none";

  const icon = document.createElement("span");
  icon.textContent = photo.icon;

  placeholder.appendChild(icon);
  placeholder.appendChild(
    document.createTextNode(`Add photo${index + 1}.jpg`)
  );

  img.addEventListener("error", () => {
    img.style.display = "none";
    placeholder.style.display = "block";
  });

  img.addEventListener("load", () => {
    img.style.display = "block";
    placeholder.style.display = "none";
  });

  const overlay = document.createElement("span");
  overlay.className = "view-overlay";
  overlay.textContent = "VIEW PHOTO ↗";

  photoWrap.append(img, placeholder, overlay);

  const info = document.createElement("span");
  info.className = "card-info";

  const title = document.createElement("h3");
  title.textContent = photo.title;

  const description = document.createElement("p");
  description.textContent = photo.description;

  info.append(title, description);
  card.append(photoWrap, info);

  card.addEventListener("click", () => openLightbox(index));

  galleryGrid.appendChild(card);
});

// ELEMENTS
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");
const lightboxTitle = document.getElementById("lightboxTitle");
const lightboxDescription =
  document.getElementById("lightboxDescription");
const lightboxCount = document.getElementById("lightboxCount");

let currentIndex = 0;
let lastFocusedElement = null;

// AUTOMATIC PHOTO COUNTER
document.getElementById("photoTotal").textContent =
  `${String(photos.length).padStart(2, "0")} PHOTOS`;

// DISPLAY A PHOTO
function showPhoto(index) {
  currentIndex = (index + photos.length) % photos.length;

  const photo = photos[currentIndex];

  lightboxImage.src = photo.src;
  lightboxImage.alt = photo.title;
  lightboxTitle.textContent = photo.title;
  lightboxDescription.textContent = photo.description;

  lightboxCount.textContent =
    `${currentIndex + 1} / ${photos.length}`;
}

// OPEN LIGHTBOX
function openLightbox(index) {
  lastFocusedElement = document.activeElement;

  showPhoto(index);

  lightbox.classList.add("open");
  lightbox.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";

  document.getElementById("lightboxClose").focus();
}

// CLOSE LIGHTBOX
function closeLightbox() {
  lightbox.classList.remove("open");
  lightbox.setAttribute("aria-hidden", "true");

  document.body.style.overflow = "";
  lightboxImage.src = "";

  if (lastFocusedElement) {
    lastFocusedElement.focus();
  }
}

// LIGHTBOX BUTTONS
document.getElementById("lightboxClose")
  .addEventListener("click", closeLightbox);

document.getElementById("previousPhoto")
  .addEventListener("click", () => {
    showPhoto(currentIndex - 1);
  });

document.getElementById("nextPhoto")
  .addEventListener("click", () => {
    showPhoto(currentIndex + 1);
  });

// CLICK OUTSIDE THE IMAGE TO CLOSE
lightbox.addEventListener("click", event => {
  if (event.target === lightbox) {
    closeLightbox();
  }
});

// KEYBOARD CONTROLS
document.addEventListener("keydown", event => {
  if (!lightbox.classList.contains("open")) return;

  if (event.key === "Escape") {
    closeLightbox();
  }

  if (event.key === "ArrowRight") {
    showPhoto(currentIndex + 1);
  }

  if (event.key === "ArrowLeft") {
    showPhoto(currentIndex - 1);
  }
});

// MOBILE NAVIGATION
const menuToggle = document.getElementById("menuToggle");
const navLinks = document.getElementById("navLinks");

menuToggle.addEventListener("click", () => {
  const expanded =
    menuToggle.getAttribute("aria-expanded") === "true";

  menuToggle.setAttribute("aria-expanded", String(!expanded));
  navLinks.classList.toggle("show", !expanded);
});

// CLOSE MOBILE MENU WHEN A LINK IS CLICKED
navLinks.querySelectorAll("a").forEach(link => {
  link.addEventListener("click", () => {
    navLinks.classList.remove("show");
    menuToggle.setAttribute("aria-expanded", "false");
  });
});
</script>
<style>/* Navigation button styling */
  .nav-links a {
      display: inline-block;
      padding: 12px 24px;
      background-color: #ffffff;
      color: #1767a5;
      border: 2px solid #1767a5;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s ease;
  }
  
  /* Hover effect */
  .nav-links a:hover {
      background-color: #1767a5;
      color: #ffffff;
      transform: translateY(-2px);
  }
  
  /* Active/current page button */
  .nav-links a[aria-current="page"] {
      background-color: #1767a5;
      color: #ffffff;
      box-shadow: 0 4px 0 #a9dcf5;
  }</style>

</body>
</html>
